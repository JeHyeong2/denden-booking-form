<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1f6feb">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>든든피플 예약 신청</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">

<style>
  :root {
    --primary: #1f6feb;
    --primary-light: #e9f1ff;
    --primary-dark: #1456c4;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --red: #ef4444;
    --red-light: #fef2f2;
    --green: #10b981;
    --green-light: #ecfdf5;
    --kakao: #fee500;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-focus: 0 0 0 3px rgba(31, 111, 235, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #f5f7fa 0%, #eef2f6 100%);
    color: var(--gray-900);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 520px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
  .subtitle { color: var(--gray-500); font-size: 14px; margin: 0; }
  .kakao-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--kakao); color: #3c1e1e;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; margin-top: 10px;
  }
  .kakao-badge::before { content: ''; width: 6px; height: 6px; background: #3c1e1e; border-radius: 50%; }

  .prefill-notice {
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    background: #fffbeb; color: #92400e; border: 1px solid #fde68a;
    border-radius: var(--radius-sm); padding: 10px 14px;
    font-size: 13px; margin-bottom: 16px;
  }
  .prefill-notice.show { display: flex; }

  /* 저장된 업체 선택 */
  .saved-biz {
    display: none;
    margin-bottom: 18px;
    padding: 14px;
    background: var(--primary-light);
    border-radius: var(--radius-sm);
    border: 1px solid #cfe0ff;
  }
  .saved-biz.show { display: block; }
  .saved-biz-label {
    font-size: 12px; font-weight: 700;
    color: var(--primary-dark);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .saved-biz-label::before { content: '🏢'; }
  .saved-biz-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
  }
  .saved-biz-row select { background: #fff; }
  .saved-biz-delete {
    padding: 0 12px;
    border: 1.5px solid var(--gray-300);
    background: #fff; color: var(--gray-500);
    border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .saved-biz-delete:not(:disabled):hover {
    border-color: var(--red); color: var(--red); background: var(--red-light);
  }
  .saved-biz-delete:disabled { opacity: 0.4; cursor: not-allowed; }
  .prefill-notice button {
    background: transparent; border: 0; color: #92400e;
    font-size: 12px; font-weight: 700; cursor: pointer;
    text-decoration: underline; padding: 0;
  }

  .card {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 28px 24px; margin-bottom: 16px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; color: var(--gray-500);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--gray-800); }
  label .req {
    display: inline-block; width: 4px; height: 4px;
    background: var(--red); border-radius: 50%;
    vertical-align: super; margin-left: 2px;
  }
  .hint { color: var(--gray-500); font-size: 12px; margin: 6px 0 0; }
  .hint.info {
    color: var(--primary-dark); background: var(--primary-light);
    padding: 10px 12px; border-radius: var(--radius-sm);
    display: flex; gap: 8px; margin-top: 0; margin-bottom: 12px;
  }
  .hint.info::before { content: 'ⓘ'; font-weight: bold; }

  input[type="text"], input[type="tel"], input[type="number"],
  textarea, select {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 15px; font-family: inherit;
    background: #fff; color: var(--gray-900);
    transition: all 0.15s; -webkit-appearance: none; appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--primary); box-shadow: var(--shadow-focus);
  }
  input[readonly] { background: var(--gray-50); color: var(--gray-700); cursor: not-allowed; }
  input::placeholder, textarea::placeholder { color: var(--gray-400); }
  textarea { min-height: 80px; resize: vertical; }
  select {
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center;
    padding-right: 38px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .addr-search { display: flex; gap: 8px; }
  .addr-search input { flex: 1; }
  .btn-search {
    padding: 0 16px; border: 1.5px solid var(--primary); background: #fff;
    color: var(--primary); border-radius: var(--radius-sm);
    font-weight: 600; cursor: pointer; white-space: nowrap;
    font-size: 14px; transition: all 0.15s;
  }
  .btn-search:hover { background: var(--primary); color: #fff; }
  .btn-search:active { transform: scale(0.97); }

  /* 캘린더 - inline (모바일 친화 크기) */
  .calendar-wrap {
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 8px;
    background: #fff;
  }
  .calendar-wrap .flatpickr-calendar.inline {
    box-shadow: none; border: 0; width: 100% !important; max-width: 100%;
  }
  .calendar-wrap .flatpickr-rContainer,
  .calendar-wrap .flatpickr-days,
  .calendar-wrap .dayContainer {
    width: 100% !important; min-width: 0 !important; max-width: 100% !important;
  }
  .calendar-wrap .dayContainer {
    display: grid !important;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .calendar-wrap .flatpickr-day {
    max-width: none !important;
    width: 100% !important;
    height: 44px !important;
    line-height: 44px !important;
    font-size: 15px;
    border-radius: 8px !important;
    margin: 0 !important;
  }
  .calendar-wrap .flatpickr-weekday {
    height: 32px; line-height: 32px;
    font-size: 12px; font-weight: 600;
    color: var(--gray-500);
  }
  .calendar-wrap .flatpickr-weekdaycontainer {
    display: grid !important;
    grid-template-columns: repeat(7, 1fr);
  }
  .calendar-wrap .flatpickr-months {
    height: 44px; margin-bottom: 4px;
  }
  .calendar-wrap .flatpickr-current-month {
    font-size: 16px; font-weight: 700; padding: 6px 0;
  }
  .calendar-wrap .flatpickr-prev-month,
  .calendar-wrap .flatpickr-next-month {
    padding: 12px;
  }
  .calendar-wrap .flatpickr-prev-month:hover,
  .calendar-wrap .flatpickr-next-month:hover {
    background: var(--gray-100); border-radius: 8px;
  }
  .flatpickr-day.selected,
  .flatpickr-day.selected.inRange {
    background: var(--primary) !important; border-color: var(--primary) !important;
    color: #fff !important;
  }
  .flatpickr-day:hover { background: var(--primary-light) !important; }
  .flatpickr-day.today {
    border-color: var(--primary) !important;
    color: var(--primary);
    font-weight: 700;
  }
  .flatpickr-day.today.selected { color: #fff !important; }

  /* 일자 상세 */
  .schedule-list { display: flex; flex-direction: column; gap: 8px; }
  .empty-state {
    text-align: center; color: var(--gray-400);
    padding: 32px 16px; margin: 0;
    background: var(--gray-50); border-radius: var(--radius-sm);
    font-size: 14px;
  }
  .schedule-row {
    display: grid;
    grid-template-columns: 90px 1fr 1fr 36px;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: var(--gray-50);
    border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200);
    max-height: 80px;
    overflow: hidden;
    animation: rowFadeIn 0.22s cubic-bezier(.22,.61,.36,1);
    transition: opacity 0.18s ease, transform 0.18s ease,
                max-height 0.22s ease, padding 0.22s ease,
                margin 0.22s ease, border-width 0.22s ease;
  }
  @keyframes rowFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .schedule-row.removing {
    opacity: 0;
    transform: translateX(16px);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin: 0;
    border-width: 0;
  }
  .empty-state {
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .schedule-summary {
    animation: fadeIn 0.18s ease;
  }
  .schedule-date {
    font-weight: 600;
    font-size: 13px;
    color: var(--gray-800);
    white-space: nowrap;
  }
  .schedule-date small {
    display: block; font-weight: 500; color: var(--gray-500); font-size: 11px;
  }
  .schedule-row select {
    padding: 8px 28px 8px 10px;
    font-size: 13px;
    background-color: #fff;
  }
  .btn-delete {
    background: transparent; border: 0; cursor: pointer;
    padding: 6px; border-radius: 6px;
    color: var(--gray-400);
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-delete:hover { background: var(--red-light); color: var(--red); }
  .schedule-summary {
    margin-top: 12px; padding: 10px 14px;
    background: var(--primary-light); color: var(--primary-dark);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .schedule-summary::before { content: '📅'; }

  /* 동의 + 제출 */
  .consent {
    display: flex; gap: 12px; padding: 16px;
    background: var(--gray-50); border-radius: var(--radius-sm);
    border: 1.5px solid var(--gray-200); margin-bottom: 16px;
    font-size: 13px; color: var(--gray-700); cursor: pointer;
    transition: all 0.18s;
  }
  .consent input[type="checkbox"] { margin: 0; width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0; }
  .consent label { margin: 0; font-weight: 500; cursor: pointer; line-height: 1.45; }
  .consent.invalid {
    background: var(--red-light);
    border-color: var(--red);
    color: #991b1b;
    animation: shake 0.32s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  .submit-btn {
    width: 100%; padding: 16px; border: 0; border-radius: var(--radius);
    background: var(--primary); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 14px rgba(31, 111, 235, 0.3);
    font-family: inherit;
  }
  .submit-btn:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
  .submit-btn:active:not(:disabled) { transform: translateY(0); }
  .submit-btn:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; }

  .result {
    display: none; padding: 24px; border-radius: var(--radius);
    margin-top: 16px; text-align: center; font-size: 14px;
  }
  .result.success { display: block; background: var(--green-light); color: #065f46; border: 1px solid #a7f3d0; }
  .result.success .check {
    display: inline-block; width: 48px; height: 48px;
    background: var(--green); border-radius: 50%;
    color: #fff; line-height: 48px; font-size: 24px;
    margin-bottom: 12px;
  }
  .result.success h2 { margin: 0 0 8px; font-size: 18px; color: #065f46; }
  .result.success .booking-id-list {
    display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    padding: 8px 0;
  }
  .result.success .booking-id {
    display: inline-block; padding: 4px 12px;
    background: #fff; border-radius: 999px;
    font-family: monospace; font-size: 13px;
    color: #065f46; font-weight: 700;
  }
  .result.error { display: block; background: var(--red-light); color: #991b1b; border: 1px solid #fecaca; }

  @media (max-width: 380px) {
    .row { grid-template-columns: 1fr; }
    .schedule-row { grid-template-columns: 70px 1fr 1fr 32px; gap: 6px; padding: 10px 8px; }
    body { padding: 16px 12px 32px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>예약 신청</h1>
    <p class="subtitle">매니저 매칭 후 입력하신 연락처로 안내드립니다</p>
    <div id="kakaoBadge" class="kakao-badge" style="display:none;">카카오톡 연결됨</div>
  </header>

  <div id="prefillNotice" class="prefill-notice">
    <span>💾 이전에 입력하신 정보를 불러왔습니다</span>
    <button type="button" id="btnClearPrefill">초기화</button>
  </div>

  <form id="bookingForm" novalidate>

    <!-- 사업장 정보 -->
    <section class="card">
      <p class="section-title">사업장 정보</p>

      <div id="savedBiz" class="saved-biz">
        <div class="saved-biz-label">저장된 업체</div>
        <div class="saved-biz-row">
          <select id="savedBizSelect">
            <option value="">+ 새 업체로 입력</option>
          </select>
          <button type="button" id="btnDeleteBiz" class="saved-biz-delete" disabled>삭제</button>
        </div>
      </div>

      <div class="field">
        <label>상호명<span class="req"></span></label>
        <input type="text" name="business_name" required maxlength="100" placeholder="예: 강남식당">
      </div>
      <div class="field">
        <label>주소<span class="req"></span></label>
        <div class="addr-search" style="margin-bottom:8px;">
          <input type="text" id="postcode" placeholder="우편번호" readonly>
          <button type="button" class="btn-search" id="btnSearchAddr">주소 검색</button>
        </div>
        <input type="text" id="addressRoad" placeholder="도로명/지번 주소" readonly required style="margin-bottom:8px;">
        <input type="text" id="addressDetail" placeholder="상세주소 (선택, 예: 3층 / 101호)" maxlength="100">
        <input type="hidden" name="address" id="addressCombined">
      </div>
    </section>

    <!-- 기본 시간 + 캘린더 -->
    <section class="card">
      <p class="section-title">예약 일정</p>

      <div class="row">
        <div class="field">
          <label>기본 시작 시간<span class="req"></span></label>
          <select id="defaultStartTime" required>
            <option value="">선택</option>
          </select>
        </div>
        <div class="field">
          <label>기본 서비스 시간<span class="req"></span></label>
          <select id="defaultDuration" required>
            <option value="">선택</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>예약 날짜<span class="req"></span></label>
        <p class="hint info">달력에서 날짜를 클릭하면 아래 목록에 추가됩니다. 다시 클릭하면 제거됩니다.</p>
        <div class="calendar-wrap"><div id="calendar"></div></div>
      </div>
    </section>

    <!-- 예약 일자 상세 -->
    <section class="card">
      <p class="section-title">예약 일자 상세</p>
      <div id="scheduleList" class="schedule-list">
        <p class="empty-state">위 달력에서 날짜를 먼저 선택해주세요</p>
      </div>
      <div id="scheduleSummary" class="schedule-summary" style="display:none;"></div>
      <input type="hidden" name="schedule" id="scheduleJson">
    </section>

    <!-- 업무 -->
    <section class="card">
      <p class="section-title">업무 내용</p>
      <div class="row">
        <div class="field">
          <label>인원<span class="req"></span></label>
          <input type="number" name="headcount" required min="1" max="50" value="1">
        </div>
        <div class="field">
          <label>업무 종류<span class="req"></span></label>
          <select name="work_type" required>
            <option value="">선택</option>
            <option>홀서빙</option>
            <option>주방보조</option>
            <option>설거지</option>
            <option>청소</option>
            <option>정리수납</option>
            <option>이사</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>특이사항</label>
        <textarea name="special_notes" maxlength="500" placeholder="예: 엘리베이터 없음, 알레르기 정보, 요청 사항 등 (선택)"></textarea>
      </div>
    </section>

    <!-- 신청자 -->
    <section class="card">
      <p class="section-title">신청자 정보</p>
      <div class="field">
        <label>성함<span class="req"></span></label>
        <input type="text" name="sender_name" required maxlength="50" placeholder="실명을 입력해주세요">
      </div>
      <div class="field">
        <label>연락처<span class="req"></span></label>
        <input type="tel" name="sender_contact" required pattern="^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$" placeholder="010-1234-5678">
        <p class="hint">매칭 결과를 이 번호로 안내드립니다</p>
      </div>
      <input type="hidden" name="sender_kakao_id" id="senderKakaoId">
    </section>

    <label class="consent">
      <input type="checkbox" id="consent" required>
      <span>개인정보(이름, 연락처)를 매칭 안내 목적으로만 수집·이용하는 데 동의합니다</span>
    </label>

    <button type="submit" class="submit-btn" id="submitBtn">신청하기</button>
  </form>

  <div id="result" class="result"></div>
</div>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>

<script>
  // ─── URL query → kakao user key ───
  const params = new URLSearchParams(location.search);
  const kakaoKey = params.get('k');
  if (kakaoKey) {
    document.getElementById('senderKakaoId').value = kakaoKey;
    document.getElementById('kakaoBadge').style.display = 'inline-flex';
  }

  // ─── localStorage: sender 정보 + businesses 배열 ───
  const STORAGE_KEY = 'denden_booking_form:' + (kakaoKey || '_default');
  const MAX_BUSINESSES = 10;

  function _uuid() {
    return (crypto && crypto.randomUUID) ? crypto.randomUUID()
      : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function loadCached() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      // 새 형식
      if (Array.isArray(raw.businesses)) return raw;
      // 옛 형식 자동 마이그레이션
      if (raw.business_name) {
        return {
          sender_name: raw.sender_name,
          sender_contact: raw.sender_contact,
          businesses: [{
            id: _uuid(),
            business_name: raw.business_name,
            postcode: raw.postcode,
            address_road: raw.address_road,
            address_detail: raw.address_detail,
            last_used: new Date().toISOString(),
          }],
        };
      }
      return { businesses: [] };
    } catch { return { businesses: [] }; }
  }

  function _writeCached(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }

  function saveBusinessAndSender(business, sender_name, sender_contact) {
    const cached = loadCached();
    cached.sender_name = sender_name;
    cached.sender_contact = sender_contact;
    cached.businesses = cached.businesses || [];
    const same = cached.businesses.find(b =>
      b.business_name === business.business_name &&
      (b.address_road || '') === (business.address_road || '')
    );
    if (same) {
      Object.assign(same, business, { last_used: new Date().toISOString() });
    } else {
      cached.businesses.push({ id: _uuid(), ...business, last_used: new Date().toISOString() });
    }
    cached.businesses.sort((a, b) => (b.last_used || '').localeCompare(a.last_used || ''));
    cached.businesses = cached.businesses.slice(0, MAX_BUSINESSES);
    _writeCached(cached);
  }

  function deleteBusiness(id) {
    const cached = loadCached();
    cached.businesses = (cached.businesses || []).filter(b => b.id !== id);
    _writeCached(cached);
  }

  function clearCached() {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }

  // ─── 시간 옵션 ───
  function timeOptions(fromHour, toHour) {
    const list = [];
    for (let h = fromHour; h <= toHour; h++) {
      for (const m of [0, 30]) {
        if (h === toHour && m === 30) continue;
        list.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
      }
    }
    return list;
  }
  const startTimeOpts = timeOptions(6, 22);
  const durationOpts = [5, 6, 7, 8, 9, 10, 11, 12, 13];

  // 기본 드롭다운 채우기
  const defStartSel = document.getElementById('defaultStartTime');
  startTimeOpts.forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v;
    defStartSel.appendChild(o);
  });
  defStartSel.value = '10:00';

  const defDurSel = document.getElementById('defaultDuration');
  durationOpts.forEach(v => {
    const o = document.createElement('option'); o.value = String(v); o.textContent = `${v}시간`;
    defDurSel.appendChild(o);
  });
  defDurSel.value = '5';

  // ─── schedule 데이터 ───
  // [{ date: 'YYYY-MM-DD', startTime: '10:00', duration: 3 }]
  let scheduleData = [];
  let suppressCalendarChange = false; // 우리가 setDate로 캘린더를 sync할 때 onChange 재진입 방지
  const REMOVE_ANIM_MS = 220;

  function addHours(time, hours) {
    const [h, m] = time.split(':').map(Number);
    const totalMin = h * 60 + m + hours * 60;
    const eh = Math.floor(totalMin / 60);
    const em = totalMin % 60;
    return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
  }

  function formatKorDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const days = ['일','월','화','수','목','금','토'];
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return { short: `${mm}/${dd}`, weekday: `(${days[d.getDay()]})` };
  }

  function renderList() {
    const list = document.getElementById('scheduleList');
    const summary = document.getElementById('scheduleSummary');
    const hidden = document.getElementById('scheduleJson');

    if (scheduleData.length === 0) {
      list.innerHTML = '<p class="empty-state">위 달력에서 날짜를 먼저 선택해주세요</p>';
      summary.style.display = 'none';
      hidden.value = '';
      return;
    }

    scheduleData.sort((a, b) => a.date.localeCompare(b.date));

    list.innerHTML = scheduleData.map((s, i) => {
      const k = formatKorDate(s.date);
      const startOpts = startTimeOpts.map(v => `<option value="${v}" ${v===s.startTime?'selected':''}>${v}</option>`).join('');
      const durOpts = durationOpts.map(v => `<option value="${v}" ${v===s.duration?'selected':''}>${v}시간</option>`).join('');
      return `
        <div class="schedule-row" data-idx="${i}">
          <div class="schedule-date">${k.short}<small>${k.weekday}</small></div>
          <select class="schedule-start" data-idx="${i}">${startOpts}</select>
          <select class="schedule-dur" data-idx="${i}">${durOpts}</select>
          <button type="button" class="btn-delete" data-idx="${i}" aria-label="삭제">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </div>`;
    }).join('');

    // 이벤트 바인딩
    list.querySelectorAll('.schedule-start').forEach(el => {
      el.addEventListener('change', e => {
        const idx = +e.target.dataset.idx;
        scheduleData[idx].startTime = e.target.value;
        updateSummary();
      });
    });
    list.querySelectorAll('.schedule-dur').forEach(el => {
      el.addEventListener('change', e => {
        const idx = +e.target.dataset.idx;
        scheduleData[idx].duration = parseInt(e.target.value, 10);
        updateSummary();
      });
    });
    list.querySelectorAll('.btn-delete').forEach(el => {
      el.addEventListener('click', e => {
        const idx = +e.currentTarget.dataset.idx;
        const row = e.currentTarget.closest('.schedule-row');
        if (!row) return;
        // 1) 즉시 시각적으로 부드럽게 사라짐
        row.classList.add('removing');
        // 2) 애니메이션 끝나면 데이터 + 캘린더 sync + 리렌더
        setTimeout(() => {
          scheduleData.splice(idx, 1);
          const remaining = scheduleData.map(s => s.date);
          // 캘린더 onChange 재진입 방지하며 동기화
          suppressCalendarChange = true;
          calendar.setDate(remaining, false);
          suppressCalendarChange = false;
          renderList();
        }, REMOVE_ANIM_MS);
      });
    });

    updateSummary();
  }

  function updateSummary() {
    const summary = document.getElementById('scheduleSummary');
    const hidden = document.getElementById('scheduleJson');
    const totalHours = scheduleData.reduce((s, x) => s + x.duration, 0);
    summary.textContent = `총 ${scheduleData.length}건 · ${totalHours}시간`;
    summary.style.display = 'flex';
    // hidden JSON에 schedule 직렬화
    hidden.value = JSON.stringify(scheduleData.map(s => ({
      booking_date: s.date,
      start_time: s.startTime,
      duration_hours: s.duration,
      booking_time: `${s.startTime}~${addHours(s.startTime, s.duration)}`
    })));
  }

  // ─── 캘린더 ───
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }

  function addNewDatesToData(newDates) {
    const defStart = defStartSel.value || '10:00';
    const defDur = parseInt(defDurSel.value || '3', 10);
    newDates.forEach(d => {
      if (!scheduleData.find(s => s.date === d)) {
        scheduleData.push({ date: d, startTime: defStart, duration: defDur });
      }
    });
  }

  const calendar = flatpickr('#calendar', {
    inline: true,
    mode: 'multiple',
    locale: 'ko',
    dateFormat: 'Y-m-d',
    minDate: 'today',
    defaultDate: [],
    onChange: function(dates) {
      if (suppressCalendarChange) return; // 우리가 setDate로 sync 중이면 무시

      const newDates = dates.map(fmtDate);
      const existingDates = scheduleData.map(s => s.date);
      const toRemoveDates = existingDates.filter(d => !newDates.includes(d));

      // 1) 제거할 행이 있으면 먼저 .removing 애니메이션 → 그 후 데이터 sync + 추가 + 리렌더
      if (toRemoveDates.length > 0) {
        // 시각적 fade-out
        toRemoveDates.forEach(d => {
          const idx = scheduleData.findIndex(s => s.date === d);
          if (idx < 0) return;
          const row = document.querySelector(`.schedule-row[data-idx="${idx}"]`);
          if (row) row.classList.add('removing');
        });
        setTimeout(() => {
          scheduleData = scheduleData.filter(s => newDates.includes(s.date));
          addNewDatesToData(newDates);
          renderList();
        }, REMOVE_ANIM_MS);
      } else {
        // 추가만 있는 경우 즉시 반영 (rowFadeIn 애니메이션이 자연 노출)
        addNewDatesToData(newDates);
        renderList();
      }
    }
  });

  // ─── 주소 (Daum Postcode) ───
  const addrCombined = document.getElementById('addressCombined');
  const addrRoad = document.getElementById('addressRoad');
  const addrDetail = document.getElementById('addressDetail');
  function syncAddress() {
    addrCombined.value = (addrRoad.value + ' ' + addrDetail.value).trim();
  }
  document.getElementById('btnSearchAddr').addEventListener('click', () => {
    new daum.Postcode({
      oncomplete: (data) => {
        document.getElementById('postcode').value = data.zonecode;
        addrRoad.value = data.roadAddress || data.jibunAddress;
        syncAddress();
        addrDetail.focus();
      },
      theme: { bgColor: '#FFFFFF', searchBgColor: '#1f6feb', queryTextColor: '#FFFFFF' }
    }).open();
  });
  addrDetail.addEventListener('input', syncAddress);

  // ─── 캐시 prefill ───
  function applyBusinessToForm(b) {
    document.querySelector('[name="business_name"]').value = b?.business_name || '';
    document.getElementById('postcode').value = b?.postcode || '';
    addrRoad.value = b?.address_road || '';
    addrDetail.value = b?.address_detail || '';
    syncAddress();
  }

  function renderSavedBiz() {
    const cached = loadCached();
    const list = cached.businesses || [];
    const wrap = document.getElementById('savedBiz');
    const sel = document.getElementById('savedBizSelect');
    const delBtn = document.getElementById('btnDeleteBiz');

    sel.innerHTML = '<option value="">+ 새 업체로 입력</option>';
    list.forEach(b => {
      const short = (b.address_road || '').slice(0, 20);
      const o = document.createElement('option');
      o.value = b.id;
      o.textContent = `${b.business_name}${short ? ` · ${short}…` : ''}`;
      sel.appendChild(o);
    });

    if (list.length > 0) {
      wrap.classList.add('show');
      // 가장 최근 업체 자동 prefill
      sel.value = list[0].id;
      applyBusinessToForm(list[0]);
      delBtn.disabled = false;
    } else {
      wrap.classList.remove('show');
      delBtn.disabled = true;
    }
  }

  const cached = loadCached();
  if (cached.sender_name) document.querySelector('[name="sender_name"]').value = cached.sender_name;
  if (cached.sender_contact) document.querySelector('[name="sender_contact"]').value = cached.sender_contact;
  renderSavedBiz();
  const hasAnyCache = (cached.businesses || []).length > 0 || cached.sender_name;
  if (hasAnyCache) document.getElementById('prefillNotice').classList.add('show');

  // ─── 카카오 ID 기반 backend history prefill (다른 기기 자동완성) ───
  const HISTORY_API = (params.get('historyApi')) || DEFAULT_API.replace('/web-form-booking', '/booking-history');
  async function fetchAndMergeHistory() {
    if (!kakaoKey) { console.log('[history] no kakao key in URL'); return; }
    console.log('[history] fetching', HISTORY_API, 'k=', kakaoKey);
    try {
      const r = await fetch(HISTORY_API + '?k=' + encodeURIComponent(kakaoKey), { method: 'GET', cache: 'no-store' });
      console.log('[history] response', r.status);
      if (!r.ok) return;
      const data = await r.json();
      console.log('[history] data', data);
      const remoteList = (data.businesses || []);
      if (remoteList.length === 0) return;
      // local과 merge (id 없는 항목 보강 + 같은 (business_name, address_road) 중복 제거)
      const local = loadCached();
      local.businesses = local.businesses || [];
      let touched = false;
      for (const rb of remoteList) {
        const sameKey = (a, b) =>
          (a.business_name || '') === (b.business_name || '') &&
          (a.address_road || a.address || '') === (b.address_road || b.address || '');
        const existing = local.businesses.find(lb => sameKey(lb, rb));
        if (existing) {
          // last_used 더 최신이면 갱신
          if ((rb.last_used || '') > (existing.last_used || '')) {
            Object.assign(existing, {
              business_name: rb.business_name,
              postcode: rb.postcode,
              address_road: rb.address_road || rb.address,
              address_detail: rb.address_detail || '',
              last_used: rb.last_used,
            });
            touched = true;
          }
        } else {
          local.businesses.push({
            id: _uuid(),
            business_name: rb.business_name,
            postcode: rb.postcode,
            address_road: rb.address_road || rb.address,
            address_detail: rb.address_detail || '',
            last_used: rb.last_used,
          });
          touched = true;
        }
      }
      if (touched) {
        local.businesses.sort((a, b) => (b.last_used || '').localeCompare(a.last_used || ''));
        local.businesses = local.businesses.slice(0, MAX_BUSINESSES);
        _writeCached(local);
        renderSavedBiz();
        document.getElementById('prefillNotice').classList.add('show');
      }
    } catch (e) { /* 네트워크 실패 무시, localStorage로만 동작 */ }
  }
  fetchAndMergeHistory();

  document.getElementById('savedBizSelect').addEventListener('change', e => {
    const id = e.target.value;
    const delBtn = document.getElementById('btnDeleteBiz');
    if (!id) {
      applyBusinessToForm(null);
      delBtn.disabled = true;
      return;
    }
    const b = (loadCached().businesses || []).find(x => x.id === id);
    if (b) applyBusinessToForm(b);
    delBtn.disabled = false;
  });

  document.getElementById('btnDeleteBiz').addEventListener('click', () => {
    const id = document.getElementById('savedBizSelect').value;
    if (!id) return;
    const b = (loadCached().businesses || []).find(x => x.id === id);
    if (!b) return;
    if (!confirm(`'${b.business_name}' 업체 정보를 삭제할까요?`)) return;
    deleteBusiness(id);
    renderSavedBiz();
  });

  document.getElementById('btnClearPrefill').addEventListener('click', () => {
    if (!confirm('저장된 모든 업체와 신청자 정보를 지울까요?')) return;
    clearCached();
    location.reload();
  });

  // ─── 폼 제출 ───
  const DEFAULT_API = 'https://plants-believes-kent-cruises.trycloudflare.com/webhook/web-form-booking';
  const apiUrl = params.get('api') || (
    location.hostname === 'localhost' ? location.origin + '/webhook/web-form-booking' : DEFAULT_API
  );

  const form = document.getElementById('bookingForm');
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    syncAddress();
    if (!addrCombined.value) { alert('주소를 검색해주세요.'); return; }
    if (scheduleData.length === 0) { alert('달력에서 예약 날짜를 1개 이상 선택해주세요.'); return; }
    const consentEl = document.getElementById('consent');
    const consentBox = consentEl.closest('.consent');
    if (!consentEl.checked) {
      consentBox.classList.add('invalid');
      consentBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => consentBox.classList.remove('invalid'), 1200);
      // 약관 강조 후 1.5초 대기 → 그래도 alert 띄움
      setTimeout(() => alert('개인정보 수집·이용에 동의해주세요.'), 350);
      return;
    }
    // 약관 체크된 상태면 invalid 클래스 제거
    consentBox.classList.remove('invalid');

    btn.disabled = true; btn.textContent = '접수 중...';
    result.className = 'result'; result.innerHTML = '';

    const formData = Object.fromEntries(new FormData(form).entries());
    const payload = {
      business_name: formData.business_name,
      address: formData.address,
      postcode: document.getElementById('postcode').value || null,
      address_road: addrRoad.value || null,
      address_detail: addrDetail.value || null,
      headcount: parseInt(formData.headcount, 10),
      work_type: formData.work_type,
      special_notes: formData.special_notes || '',
      sender_name: formData.sender_name,
      sender_contact: formData.sender_contact,
      schedule: JSON.parse(formData.schedule || '[]'),
    };
    if (formData.sender_kakao_id) payload.sender_kakao_id = formData.sender_kakao_id;

    try {
      const r = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await r.json();
      if (r.ok && (json.booking_id || json.booking_ids)) {
        saveBusinessAndSender({
          business_name: payload.business_name,
          postcode: document.getElementById('postcode').value,
          address_road: addrRoad.value,
          address_detail: addrDetail.value,
        }, payload.sender_name, payload.sender_contact);
        const ids = json.short_ids || (json.booking_ids ? json.booking_ids.map(x => x.substring(0,8)) : [json.short_id || json.booking_id.substring(0,8)]);
        const count = json.booking_count || ids.length;
        const idsHtml = ids.map(id => `<span class="booking-id">#${id}</span>`).join('');
        result.className = 'result success';
        result.innerHTML = `
          <div class="check">✓</div>
          <h2>총 ${count}건 접수 완료</h2>
          <div class="booking-id-list">${idsHtml}</div>
          <p style="margin-top:12px;">${json.message || '매니저 매칭 후 안내드리겠습니다.'}</p>
        `;
        form.style.display = 'none';
        document.getElementById('prefillNotice').classList.remove('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        throw new Error(json.message || 'submit failed');
      }
    } catch (err) {
      result.className = 'result error';
      result.textContent = '접수 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      btn.disabled = false; btn.textContent = '신청하기';
    }
  });
</script>
</body>
</html>
